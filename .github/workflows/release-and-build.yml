name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    name: Release Please (PR Gate)
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      body: ${{ steps.release.outputs.body }}
    steps:
      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add Modrinth changelog block to the release PR
        if: ${{ steps.release.outputs.release_created != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          PR=$(gh pr list --state open --base main --json number,headRefName \
                 --jq '[.[] | select(.headRefName | startswith("release-please--"))][0].number // empty')
          [ -z "$PR" ] && exit 0
          BODY=$(gh pr view "$PR" --json body --jq .body | tr -d '\r')
          if printf '%s\n' "$BODY" | grep -q '<!-- modrinth-changelog:start -->'; then
            exit 0
          fi
          {
            printf '%s\n\n' "$BODY"
            printf '%s\n' '---'
            printf '%s\n' '### Modrinth release'
            printf '%s\n' '<!-- Write the Modrinth changelog between the markers below. Do not remove the markers. -->'
            printf '%s\n' '<!-- modrinth-changelog:start -->'
            printf '%s\n' '<!-- modrinth-changelog:end -->'
          } > /tmp/pr-body.md
          gh pr edit "$PR" --body-file /tmp/pr-body.md

  resolve-release:
    name: Resolve Release Info
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.resolve.outputs.tag_name }}
      version_number: ${{ steps.resolve.outputs.version_number }}
      release_type: ${{ steps.resolve.outputs.release_type }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
      github_changelog: ${{ steps.resolve.outputs.github_changelog }}
      modrinth_changelog: ${{ steps.resolve.outputs.modrinth_changelog }}
    steps:
      - name: Resolve type from tag and read Modrinth changelog from the merged PR
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RP_TAG: ${{ needs.release-please.outputs.tag_name }}
          RP_BODY: ${{ needs.release-please.outputs.body }}
        run: |
          VERSION_NUMBER="${RP_TAG#v}"
          RELEASE_TYPE=release
          PRERELEASE=false
          case "$RP_TAG" in
            *-alpha*) RELEASE_TYPE=alpha; PRERELEASE=true ;;
            *-beta*)  RELEASE_TYPE=beta;  PRERELEASE=true ;;
          esac

          PR_BODY=$(gh api "repos/${GH_REPO}/commits/${SHA}/pulls" \
            --jq '[.[] | select(.head.ref | startswith("release-please--"))][0].body // ""' | tr -d '\r')

          MODRINTH_CHANGELOG=$(printf '%s\n' "$PR_BODY" | awk '
            /<!-- modrinth-changelog:start -->/ { f = 1; next }
            /<!-- modrinth-changelog:end -->/   { f = 0 }
            f { print }
          ')
          if [ -z "$(printf '%s' "$MODRINTH_CHANGELOG" | tr -d '[:space:]')" ]; then
            echo "::warning::No Modrinth changelog block in the release PR; using the generated changelog."
            MODRINTH_CHANGELOG="$RP_BODY"
          fi

          D="EOF_${GITHUB_RUN_ID}"
          {
            echo "tag_name=${RP_TAG}"
            echo "version_number=${VERSION_NUMBER}"
            echo "release_type=${RELEASE_TYPE}"
            echo "prerelease=${PRERELEASE}"
            echo "github_changelog<<${D}"
            printf '%s\n' "$RP_BODY"
            echo "${D}"
            echo "modrinth_changelog<<${D}"
            printf '%s\n' "$MODRINTH_CHANGELOG"
            echo "${D}"
          } >> "$GITHUB_OUTPUT"

  build-and-pack:
    name: Build & Pack (MC ${{ matrix.minecraft_version }})
    needs: resolve-release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        minecraft_version: [1.17.1, 1.18.2, 1.19.2, 1.19.4, 1.20.1, 1.20.4]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Read Manifest Version
        run: |
          if [ -f .release-please-manifest.json ]; then
            echo "MANIFEST_VERSION=$(jq -r '.["."]' .release-please-manifest.json)" >> $GITHUB_ENV
          else
            echo "MANIFEST_VERSION=" >> $GITHUB_ENV
            echo "Warning: .release-please-manifest.json not found. Skipping validation."
          fi

      - name: Read Gradle Version
        run: |
          GRADLE_VERSION=$(grep -E '^(mod_version|version)[[:space:]]*=[[:space:]]*' gradle.properties | cut -d= -f2 | tr -d '[:space:]' | tr -d '\r')
          echo "GRADLE_VERSION=$GRADLE_VERSION" >> $GITHUB_ENV

      - name: Verify Version Consistency
        run: |
          echo "manifest: ${MANIFEST_VERSION:-N/A} | gradle.properties: ${GRADLE_VERSION:-N/A}"
          if [ -n "$MANIFEST_VERSION" ] && [ -n "$GRADLE_VERSION" ] && [ "$MANIFEST_VERSION" != "$GRADLE_VERSION" ]; then
            echo "ERROR: .release-please-manifest.json ($MANIFEST_VERSION) does not match gradle.properties ($GRADLE_VERSION)"
            exit 1
          fi

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x gradlew

      - name: Build Fabric and Forge Modules
        run: |
          for i in {1..3}; do
            ./gradlew fabric:build forge:build \
              --no-daemon \
              --stacktrace \
              "-PminecraftVersion=${{ matrix.minecraft_version }}" \
              "-Dorg.gradle.internal.http.socketTimeout=120000" \
              "-Dorg.gradle.internal.http.connectionTimeout=120000" && break || echo "Build failed, retrying in 10 seconds..." && sleep 10
            if [ $i -eq 3 ]; then
              exit 1
            fi
          done

      - name: Upload Artifact
        uses: actions/upload-artifact@v5
        with:
          name: mtr-rail-works-jars-${{ matrix.minecraft_version }}
          path: build/release/*.jar
          retention-days: 7

  publish-github-release:
    name: Publish GitHub Release
    needs: [resolve-release, build-and-pack]
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v6
        with:
          pattern: mtr-rail-works-jars-*
          path: ./ready-libs
          merge-multiple: true

      - name: Create or Update Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          CHANGELOG: ${{ needs.resolve-release.outputs.github_changelog }}
          TAG: ${{ needs.resolve-release.outputs.tag_name }}
          PRERELEASE: ${{ needs.resolve-release.outputs.prerelease }}
        run: |
          printf '%s\n' "$CHANGELOG" > /tmp/changelog.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes-file /tmp/changelog.md --prerelease="$PRERELEASE"
          else
            gh release create "$TAG" --title "$TAG" --notes-file /tmp/changelog.md --prerelease="$PRERELEASE"
          fi

      - name: Upload Files to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.resolve-release.outputs.tag_name }}
        run: |
          for file in ./ready-libs/*.jar; do
            if [ -f "$file" ] && [[ ! "$file" =~ (sources|dev|sources-dev|slim)\.jar$ ]]; then
              echo "Uploading asset: $file"
              gh release upload "$TAG" "$file" --clobber
            fi
          done

  publish-modrinth:
    name: Publish to Modrinth (${{ matrix.loader }} ${{ matrix.minecraft_version }})
    needs: [resolve-release, build-and-pack, publish-github-release]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        minecraft_version: [1.17.1, 1.18.2, 1.19.2, 1.19.4, 1.20.1, 1.20.4]
        loader: [fabric, forge]
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v6
        with:
          name: mtr-rail-works-jars-${{ matrix.minecraft_version }}
          path: ./ready-libs

      - name: Publish to Modrinth
        uses: Kira-NT/mc-publish@52307b03863581dec6b652b83e597aec02ebb075 # v3
        with:
          modrinth-id: "xqd2bMI8"
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          name: "MTR Rail Works ${{ needs.resolve-release.outputs.tag_name }} for ${{ matrix.loader }} ${{ matrix.minecraft_version }}"
          version: ${{ needs.resolve-release.outputs.version_number }}
          version-type: ${{ needs.resolve-release.outputs.release_type }}
          changelog: ${{ needs.resolve-release.outputs.modrinth_changelog }}
          files: ./ready-libs/*-${{ matrix.loader }}-*.jar
          game-versions: ${{ matrix.minecraft_version }}
          loaders: ${{ matrix.loader }}
          retry-attempts: 2
          retry-delay: 10000
